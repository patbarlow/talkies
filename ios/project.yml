name: YapIOS
options:
  bundleIdPrefix: app.yap
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  defaultConfig: Debug

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: T544U3WVL6
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  YapIOS:
    type: application
    platform: iOS
    sources:
      - path: YapIOS
      - path: Shared
    info:
      path: YapIOS/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: app.yap.YapIOS
            CFBundleURLSchemes:
              - yapapp
        LSRequiresIPhoneOS: true
        NSMicrophoneUsageDescription: "Yap records your voice to transcribe speech to text."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: systemBackground
        UIRequiredDeviceCapabilities:
          - armv7
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.yap.YapIOS
        PRODUCT_NAME: Yap
        CODE_SIGN_ENTITLEMENTS: YapIOS/YapIOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "NO"
    dependencies:
      - target: YapKeyboard
        embed: true
        codeSign: true

  YapKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: YapKeyboard
      - path: Shared
    info:
      path: YapKeyboard/Info.plist
      properties:
        CFBundleDisplayName: Yap Keyboard
        NSExtension:
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: KeyboardViewController
        NSMicrophoneUsageDescription: "Yap records your voice to transcribe speech to text."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.yap.YapIOS.Keyboard
        PRODUCT_NAME: YapKeyboard
        CODE_SIGN_ENTITLEMENTS: YapKeyboard/YapKeyboard.entitlements
        GENERATE_INFOPLIST_FILE: "NO"
